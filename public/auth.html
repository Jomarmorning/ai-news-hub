<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - OpenClaw Hub</title>
    <meta name="description" content="登录OpenClaw Hub账号，访问Pro技能、管理订阅和购买记录">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/openclaw.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-animation">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar auth-navbar">
        <div class="nav-brand">
            <a href="index.html" class="logo">
                <span class="logo-icon">◈</span>
                <span class="logo-text">AI Hub</span>
            </a>
            <span class="nav-divider">/</span>
            <a href="openclaw.html" class="sub-logo">
                <span class="sub-logo-icon">⚡</span>
                <span class="sub-logo-text">OpenClaw</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">🏠 首页</a>
            <a href="openclaw.html" class="nav-link">⚡ OpenClaw</a>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="auth-container">
        <div class="auth-card">
            <!-- 左侧装饰 -->
            <div class="auth-decoration">
                <div class="decoration-content">
                    <span class="decoration-icon">⚡</span>
                    <h2>加入 OpenClaw<br>开发者社区</h2>
                    <p>解锁 Pro 技能、获取独家教程、参与社区讨论</p>
                    <div class="decoration-features">
                        <div class="feature-item">
                            <span class="feature-icon">🔓</span>
                            <span>访问 28+ Pro 技能</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">📚</span>
                            <span>独家教程和文档</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">💬</span>
                            <span>开发者社区支持</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">🎁</span>
                            <span>新用户专属优惠</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧表单 -->
            <div class="auth-form-wrapper">
                <!-- 标签切换 -->
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">登录</button>
                    <button class="auth-tab" data-tab="register">注册</button>
                </div>

                <!-- 登录表单 -->
                <form class="auth-form" id="loginForm">
                    <div class="form-header">
                        <h3>欢迎回来</h3>
                        <p>登录你的 OpenClaw 账号</p>
                    </div>

                    <div class="form-group">
                        <label for="loginEmail">邮箱</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="loginEmail" name="email" placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="loginPassword" name="password" placeholder="输入密码" required>
                            <button type="button" class="toggle-password" data-target="loginPassword">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" name="remember">
                            <span class="checkmark"></span>
                            <span>记住我</span>
                        </label>
                        <a href="#" class="forgot-link" onclick="showForgotPassword()">忘记密码？</a>
                    </div>

                    <button type="submit" class="btn-auth btn-primary">
                        <span>🔑 登录</span>
                    </button>

                    <div class="divider">
                        <span>或使用以下方式</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="btn-social" onclick="socialLogin('github')">
                            <span class="social-icon">🐙</span>
                            <span>GitHub</span>
                        </button>
                        <button type="button" class="btn-social" onclick="socialLogin('google')">
                            <span class="social-icon">🔍</span>
                            <span>Google</span>
                        </button>
                    </div>
                </form>

                <!-- 注册表单 -->
                <form class="auth-form hidden" id="registerForm">
                    <div class="form-header">
                        <h3>创建账号</h3>
                        <p>开始你的 OpenClaw 自动化之旅</p>
                    </div>

                    <div class="form-group">
                        <label for="registerName">用户名</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="registerName" name="username" placeholder="设置用户名" required minlength="3" maxlength="20">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">邮箱</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="registerEmail" name="email" placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="registerPassword" name="password" placeholder="设置密码（至少8位）" required minlength="8">
                            <button type="button" class="toggle-password" data-target="registerPassword">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar"></div>
                            <span class="strength-text">密码强度</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">确认密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" name="agree" required>
                            <span class="checkmark"></span>
                            <span>我同意 <a href="#" onclick="showTerms()">服务条款</a> 和 <a href="#" onclick="showPrivacy()">隐私政策</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn-auth btn-primary">
                        <span>✨ 创建账号</span>
                    </button>

                    <div class="divider">
                        <span>或使用以下方式</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="btn-social" onclick="socialLogin('github')">
                            <span class="social-icon">🐙</span>
                            <span>GitHub</span>
                        </button>
                        <button type="button" class="btn-social" onclick="socialLogin('google')">
                            <span class="social-icon">🔍</span>
                            <span>Google</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer auth-footer">
        <div class="footer-content">
            <p class="footer-text">© 2026 OpenClaw Hub. 保留所有权利。</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
